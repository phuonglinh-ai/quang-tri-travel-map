<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Quản trị nội dung</title>
  <script>
    // "config.json" bên dưới là đường dẫn tương đối: thiếu dấu "/" cuối (…/admin) thì trình duyệt
    // tìm nhầm ở thư mục cha. Tự thêm "/" trên mọi hosting; Vercel còn chuyển hướng sẵn (vercel.json).
    if (!/\/(index\.html)?$/.test(location.pathname)) location.replace(location.pathname + '/' + location.search + location.hash);
  </script>
  <!-- Cấu hình sinh bởi scripts/build-cms-config.mjs, không sửa tay. -->
  <link href="config.json" type="application/json" rel="cms-config-url">
</head>
<body>
  <!-- Sveltia CMS, cố định phiên bản để giao diện không tự thay đổi. Nâng cấp: đổi số phiên bản rồi kiểm tra lại. -->
  <script src="https://unpkg.com/@sveltia/cms@0.227.0/dist/sveltia-cms.js"></script>
</body>
</html>
